<style>
  :root {
    --bg:      #0e0f12;   /* not quite black, so the black chips read as chips */
    --panel:   #131417;
    --panel2:  #1b1d21;
    --panel3:  #24272c;
    --line:    #2a2d33;
    --fg:      #f2f3f5;
    --dim:     #949aa3;   /* text: >= 4.5:1 on --panel and --panel2 */
    --mute:    #5d626a;   /* never text: rules, dots, inert marks */
    --flag:    #c9a227;
    --bad:     #dc2127;

    /* env() resolves to 0 inside the Apps Script iframe, so these are floors,
       not decoration: the footer would otherwise sit in the home indicator's
       swipe zone and the NOW bar under the Dynamic Island. */
    --pad-t: max(env(safe-area-inset-top), 10px);
    --pad-b: max(env(safe-area-inset-bottom), 28px);
    --pad-x: max(env(safe-area-inset-left), 8px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--fg);
    font: 400 16px/1.3 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
  }
  body { user-select: none; -webkit-user-select: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .hidden { display: none !important; }

  #app {
    position: relative;
    display: flex; flex-direction: column; gap: 6px;
    /* Order matters: the later declaration wins, so dvh must come second.
       Reversed, 100vh takes over on iOS — the large viewport, sized as if the
       browser toolbars were hidden — and the app runs off the bottom of the
       screen behind them. */
    height: 100vh; height: 100dvh;
    padding: var(--pad-t) var(--pad-x) var(--pad-b);
  }

  /* ── now bar ─────────────────────────────────────────────────
     Fixed height in every state. Nothing below it may ever move. */
  /* No NOW bar. The note and the clock belong to the block that is running,
     and the block that is running is the lit box, so they live in it. Nothing
     is left for a bar at the top to hold. */
  /* In the posture row, which is chrome, rather than floating over whichever
     category happens to be in the top right corner. */
  /* Quiet means gone, not a shade darker. A failure then announces itself by
     appearing, which is far harder to miss than a 9px dot changing colour —
     and the posture label gets the middle of the row back. */
  #sync {
    flex: 0 0 auto; display: flex; align-items: center; gap: 5px;
    padding: 0 11px; border-radius: 9px; background: var(--panel2);
  }
  #sync.s-synced { display: none; }
  #sync::after { content: ''; width: 9px; height: 9px; border-radius: 50%; background: #4b5057; }
  #sync.s-pending::after { background: var(--flag); }
  #sync.s-failed::after  { background: var(--bad); }
  #syncN { font-size: 11px; font-variant-numeric: tabular-nums; color: #fff; font-weight: 700; }
  #syncN:empty { display: none; }

  /* ── posture ─────────────────────────────────────────────────
     One button, two states. Only sitting is written to a calendar, so "not
     sitting" is the absence of a SIT block rather than a state of its own —
     which is why the button needs nothing remembered to know what it says. */
  #postureRow { position: relative; flex: 0 0 72px; }
  #posture {
    position: absolute; inset: 0; display: flex; gap: 4px;
    background: var(--panel); border-radius: 12px; padding: 4px;
  }
  #postureBtn {
    flex: 1; min-width: 0; border-radius: 9px;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    color: var(--dim); transition: background .12s ease-out, color .12s ease-out;
  }
  #postureBtn svg { width: 25px; height: 25px; }
  #postureBtn .pl { font-size: 14px; font-weight: 700; letter-spacing: .15em; }
  /* Two channels, not one: a filled pill and full-brightness text. The label
     names the state rather than the action, so the state has to be obvious
     enough that nobody has to work out which of the two it is. */
  #postureBtn.on {
    background: var(--panel3); color: var(--fg);
    box-shadow: inset 0 0 0 1px var(--line);
  }
  #postureBtn.on .pl { letter-spacing: .17em; }
  #postureBtn:active { background: var(--panel2); }
  /* Both selectors carry two ids so neither can be outranked by the element
     rule above, which is what left both icons on screen at once. */
  #postureBtn #icSit, #postureBtn #icStand { display: none; }
  #postureBtn.on #icSit { display: block; }
  #postureBtn:not(.on) #icStand { display: block; }
  /* The clock is also the way in to correcting when it started, which is the
     only moment that correction means anything. */
  #sitEdit {
    flex: 0 0 auto; padding: 0 14px; border-radius: 9px;
    font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums;
    color: var(--dim); background: var(--panel2);
  }
  #sitEdit.off { display: none; }
  #sitEdit:active { background: var(--panel3); }

  /* ── grid ────────────────────────────────────────────────── */
  /* 1fr rows, not auto. Auto rows size to their content, so the lit box grew
     the whole row the moment it gained a note and the grid shifted under the
     thumb. Every box is now the same height in every state. */
  #grid { flex: 1 1 auto; display: grid; gap: 6px; min-height: 0; grid-auto-rows: 1fr; }
  /* Nothing running dims every box. One bright box against five dim ones is a
     difference you catch without reading anything; the absence of a ring was
     not, and mistaking idle for running is the one failure that puts a hole in
     the record. The veil sits behind the label, so contrast is untouched. */
  .gbtn::before {
    content: ''; position: absolute; inset: 0; z-index: 0;
    background: #000; opacity: 0; border-radius: 12px; pointer-events: none;
    transition: opacity .25s ease-out;
  }
  #grid.idle .gbtn:not(.addcell)::before { opacity: .58; }
  .gbtn .k, .gbtn .gn, .gbtn .ge, .gbtn .cf { position: relative; z-index: 1; }
  .gbtn {
    position: relative; cursor: pointer; font: inherit; color: inherit;
    background: var(--panel2); border-radius: 12px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 9px; overflow: hidden; min-height: 0;
    transition: transform .12s ease-out, background .12s ease-out;
  }
  /* brightness, not a fixed grey: the background is now a different colour per
     button, so the pressed state has to work against any hue */
  .gbtn:active, .gbtn.tapped { filter: brightness(.86); transform: scale(.975); }
  .gbtn:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
  #postureBtn:focus-visible, #sitEdit:focus-visible { outline: 2px solid var(--fg); outline-offset: -2px; }
  /* The label as written in CONFIG, verbatim. The key still prefixes the
     calendar title and heads the rollup's columns; it is not what you aim at.
     White on a black highlight is 21:1 on every button, so legibility stops
     depending on which colour the category happens to be. */
  .gbtn .k {
    background: #000; color: #fff;
    font-size: 26px; font-weight: 700; line-height: 1.2; letter-spacing: .01em;
    padding: 9px 15px; border-radius: 10px; max-width: calc(100% - 20px);
    text-align: center; overflow-wrap: break-word; hyphens: none; text-wrap: balance;
  }
  /* The note and the clock only exist while the box is the open block. Both
     ride the same black backing as the label, so they stay legible on any
     colour in the palette without a per-colour rule. */
  .gbtn .gn, .gbtn .ge { display: none; }
  .gbtn.active .gn, .gbtn.active .ge { display: block; }
  .gbtn .gn {
    margin-top: 7px; width: calc(100% - 20px);
    background: #000; color: #fff; border: 0; border-radius: 8px;
    font: 400 16px/1.25 inherit; padding: 7px 10px; text-align: center;
    user-select: text; -webkit-user-select: text;
  }
  .gbtn .gn::placeholder { color: #8b9098; font-weight: 400; }
  /* Pinned to a corner rather than stacked, so a running block's clock cannot
     push its own label around. Top left: the sync pill owns the top right. */
  .gbtn .ge {
    position: absolute; top: 7px; left: 9px; opacity: .72;
    background: #000; color: #fff;
    font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums;
    padding: 2px 6px; border-radius: 5px; letter-spacing: .04em;
  }
  .gbtn.long .ge { color: var(--flag); }
  /* Outside the button, not inside it. An inset ring has to contrast with the
     button, which forced a per-colour choice, and the colours that chose black
     got a black ring on a black page — indistinguishable from the tile simply
     being smaller. An outset ring sits in the gap, where the page is always
     black, so one white is right for every colour. */
  /* Breathing, not blinking: the ring fades and returns over two and a half
     seconds so the running block reads as alive without becoming ambient
     noise. Reduce Motion turns it off, as every animation here does. */
  @keyframes ringBreath {
    0%, 100% { box-shadow: 0 0 0 3px rgba(242, 243, 245, 1); }
    50%      { box-shadow: 0 0 0 3px rgba(242, 243, 245, .34); }
  }
  .gbtn.active {
    box-shadow: 0 0 0 3px var(--fg);
    animation: ringBreath 2.5s ease-in-out infinite;
  }
  /* The add box. Outlined rather than filled, because it is not a category
     yet and must not read like one. */
  .gspacer { border-radius: 12px; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .045); }
  /* Dashed, so a glance tells you it is a slot for a category rather than one
     you can log against. Same size as the rest, per the grid's own rule. */
  .addcell {
    background: var(--panel); box-shadow: none;
    border: 2px dashed var(--line);
  }
  .addcell .k { background: none; color: var(--dim); font-size: 40px; font-weight: 300; padding: 0; }
  .addcell.naming .k { display: none; }
  .addcell .an { display: none; }
  .addcell.naming .an { display: block; }
  .addcell .an {
    width: calc(100% - 20px); background: #000; color: #fff; border: 0;
    border-radius: 8px; font: 700 19px/1.25 inherit; padding: 10px;
    text-align: center; user-select: text; -webkit-user-select: text;
  }
  .addcell .an::placeholder { color: var(--mute); font-weight: 400; }
  .addcell.busy { opacity: .5; }
  /* Armed, not committed. Amber rather than white so it cannot be mistaken for
     the ring that means "this one is running". */
  .gbtn.arming { box-shadow: 0 0 0 3px var(--flag); }
  .gbtn .cf {
    margin-top: 9px; font-size: 11px; font-weight: 700; letter-spacing: .14em;
    color: #fff; background: var(--flag); padding: 4px 9px; border-radius: 6px;
  }
  .gbtn .cf:empty { display: none; }

  /* The mark strip takes the posture row's place for its six seconds. Same
     slot, same height, so nothing above it moves — and the marks stay in the
     thumb arc rather than going back to the far corner of the screen. Posture
     is unreachable for those six seconds, with a one-tap escape: choosing a
     mark dismisses immediately. */
  .fbtn {
    flex: 1; background: var(--panel); border-radius: 10px;
    font-size: 13px; font-weight: 700; letter-spacing: .12em; color: var(--dim);
  }
  .fbtn:active { background: var(--panel2); }
  #strip {
    position: absolute; inset: 0; display: flex; gap: 6px;
    align-items: center; background: var(--panel2); border-radius: 12px;
    padding: 0 6px 0 16px;
  }
  #stripHead { cursor: pointer; }
  #stripHead { flex: 1; min-width: 0; font-size: 13px; color: var(--fg); letter-spacing: .02em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .strip-marks { display: flex; gap: 6px; }
  .strip-marks button {
    width: 74px; height: 42px; background: var(--panel); border-radius: 8px;
    font-size: 22px; font-weight: 600;
  }
  .strip-marks button:active { background: var(--panel3); }

  /* Errors float above the footer so nothing in the layout shifts. */
  #err {
    position: absolute; left: var(--pad-x); right: var(--pad-x);
    bottom: calc(var(--pad-b) + 78px); z-index: 20;
    background: #2a1416; color: #ffb4ad; font-size: 12px;
    padding: 9px 12px; border-radius: 8px;
    user-select: text; -webkit-user-select: text;
  }
  #err.tappable { cursor: pointer; }
  #err.tappable::after { content: ' ›'; font-weight: 700; }

  /* ── set-aside writes ────────────────────────────────────── */
  .deadrow { background: var(--panel); border-radius: 10px; padding: 13px; }
  .deadrow .dwhen {
    font-size: 11px; font-weight: 700; letter-spacing: .17em; color: var(--dim);
    font-variant-numeric: tabular-nums;
  }
  .deadrow .dwhat { font-size: 15px; margin-top: 7px; }
  .deadrow .dwhy {
    font-size: 12px; color: #ffb4ad; margin-top: 7px;
    word-break: break-word; user-select: text; -webkit-user-select: text;
  }
  #deadList { display: flex; flex-direction: column; gap: 9px; }

  /* ── overlays ────────────────────────────────────────────── */
  .view {
    position: fixed; inset: 0; background: var(--bg); z-index: 30;
    display: flex; flex-direction: column; gap: 8px;
    padding: var(--pad-t) var(--pad-x) var(--pad-b);
  }
  .vhead { display: flex; gap: 6px; align-items: center; flex: 0 0 48px; }
  .vhead .fbtn { flex: 0 0 auto; padding: 0 18px; height: 100%; }
  .vtitle { flex: 1; text-align: center; font-size: 12px; font-weight: 700; letter-spacing: .17em; color: var(--dim); }
  .sheetbody { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--panel); border-radius: 10px; padding: 15px; }
  .card .lab { font-size: 11px; font-weight: 700; letter-spacing: .17em; color: var(--dim); margin-bottom: 9px; }
  .card .big { font-size: 24px; font-variant-numeric: tabular-nums; }
  .card .sub { font-size: 13px; color: var(--dim); margin-top: 7px; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; margin: 16px 0 2px; accent-color: #949aa3; height: 34px; }
  .ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
  #splitGrid { display: grid; gap: 6px; }
  .sbtn { background: var(--panel2); border-radius: 10px; padding: 14px 8px;
    display: flex; align-items: center; justify-content: center; }
  .sbtn .f { background: #000; color: #fff; font-size: 16px; font-weight: 700;
    padding: 7px 12px; border-radius: 8px; max-width: 100%;
    text-align: center; line-height: 1.15; overflow-wrap: break-word; }
  .sbtn:active { filter: brightness(.86); }
  .danger { background: #2a1416; color: #ffb4ad; border-radius: 10px; height: 48px; font-size: 13px; font-weight: 700; letter-spacing: .1em; }

  @media (prefers-reduced-motion: reduce) {
    .gbtn, .gbtn::before { transition: none; }
    .gbtn:active, .gbtn.tapped { transform: none; }
    .gbtn.active { animation: none; }
  }
</style>

<div id="app">
  <div id="grid"></div>

  <div id="postureRow">
    <div id="posture">
      <div id="sync" class="s-synced"><span id="syncN"></span></div>
      <button id="postureBtn" aria-pressed="false" aria-label="sitting">
        <svg id="icSit" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="8.5" cy="4.6" r="2.4" fill="currentColor"/>
          <path d="M8.5 8.2v6.3h7v6.9M5.2 21.4h3.3" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <svg id="icStand" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="4.6" r="2.4" fill="currentColor"/>
          <path d="M12 8.2v6.6M8.4 11.2h7.2M9.4 21.4 12 14.8l2.6 6.6" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="pl" id="postureLabel">NOT SITTING</span>
      </button>
      <button id="sitEdit" class="off" aria-label="adjust when sitting started"><span id="sitEl"></span></button>
    </div>

    <div id="strip" class="hidden">
      <div id="stripHead"></div>
      <div class="strip-marks">
        <button data-mark="+">+</button>
        <button data-mark="=">=</button>
        <button data-mark="-">-</button>
      </div>
    </div>
  </div>

  <div id="err" class="hidden"></div>
</div>

<!-- ── set-aside writes ─────────────────────────────────────────── -->
<div id="sheetDead" class="view hidden">
  <div class="vhead">
    <div class="vtitle">SET ASIDE</div>
    <button id="dgClose" class="fbtn">DONE</button>
  </div>
  <div class="sheetbody">
    <div id="deadList"></div>
  </div>
</div>

<!-- ── split ────────────────────────────────────────────────────── -->
<div id="sheetSplit" class="view hidden">
  <div class="vhead">
    <div class="vtitle">SPLIT</div>
    <button id="spClose" class="fbtn">DONE</button>
  </div>
  <div class="sheetbody">
    <div class="card">
      <div class="lab" id="spLab">OPEN BLOCK</div>
      <div class="big" id="spAt">--:--</div>
      <input type="range" id="spRange" min="0" max="1" value="0" step="1">
      <div class="ends"><span id="spStart"></span><span id="spNow"></span></div>
      <div class="sub" id="spSub"></div>
    </div>
    <div class="card">
      <div class="lab">REMAINDER IS</div>
      <div id="splitGrid"></div>
    </div>
  </div>
</div>

<!-- ── sit start ────────────────────────────────────────────────── -->
<div id="sheetSit" class="view hidden">
  <div class="vhead">
    <div class="vtitle">SITTING START</div>
    <button id="ssClose" class="fbtn">DONE</button>
  </div>
  <div class="sheetbody">
    <div class="card">
      <div class="lab">STARTED AT</div>
      <div class="big" id="ssAt">--:--</div>
      <input type="range" id="ssRange" min="0" max="1" value="0" step="1">
      <div class="ends"><span id="ssLo"></span><span id="ssHi"></span></div>
      <div class="sub" id="ssSub"></div>
    </div>
    <button id="ssApply" class="fbtn" style="width:100%;height:48px">APPLY</button>
    <button id="ssDelete" class="danger">DISCARD THIS SIT BLOCK</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var CFG = <?!= bootstrap ?>;

  var K_QUEUE = 'tt.queue.v1';
  var K_STATE = 'tt.state.v1';
  var K_DEAD  = 'tt.dead.v1';
  var K_BLOCKS = 'tt.blocks.v1';
  var MS_MIN = 60000;

  var CATS = CFG.categories;
  var catByKey = {};
  CATS.forEach(function (c) { catByKey[c.key] = c; });

  /* ── state ─────────────────────────────────────────────────── */

  var S = { open: null, sit: null, lastTapMs: 0 };
  var strip = null;          // {ref, key, durMs, hintMs, timer}
  var armed = null;          // {key, timer} — a tap waiting to be confirmed
  var CELL = {};             // key -> {box, note, el}, so the lit one is O(1)
  var flushing = false, retryTimer = null, retryDelay = 4000, lastStateMs = 0;
  var noteTimer = null;
  var split = { atMs: 0, startMs: 0, nowMs: 0 };
  var sitEdit = { lo: 0, hi: 0, atMs: 0 };

  var $ = function (id) { return document.getElementById(id); };
  var hasRun = (typeof google !== 'undefined' && google.script && google.script.run);

  function uid() {
    var s = '';
    for (var i = 0; i < 16; i++) s += 'abcdefghijklmnopqrstuvwxyz0123456789'[Math.floor(Math.random() * 36)];
    return s;
  }
  function ls(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
  function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function saveState() { lsSet(K_STATE, S); }

  /* ── formatting ────────────────────────────────────────────── */

  function pad2(n) { return String(n).replace(/^(\d)$/, '0$1'); }
  function fmtEl(ms) {
    if (!(ms > 0)) ms = 0;
    var m = Math.floor(ms / MS_MIN), h = Math.floor(m / 60);
    return h ? (h + 'h' + pad2(m % 60)) : (m + 'm');
  }
  function fmtDur(ms) {
    var m = Math.max(0, Math.round(ms / MS_MIN)), h = Math.floor(m / 60);
    return h ? (h + 'h ' + (m % 60) + 'm') : (m + 'm');
  }
  function clock(ms) {
    var d = new Date(ms), h = d.getHours() % 12;
    return (h === 0 ? 12 : h) + ':' + pad2(d.getMinutes()) +
           (d.getHours() < 12 ? ' AM' : ' PM');
  }

  /* ── queue ─────────────────────────────────────────────────── */

  function queue() { var q = ls(K_QUEUE, []); return Array.isArray(q) ? q : []; }
  function setQueue(q) { lsSet(K_QUEUE, q); paintSync(); }

  function enqueue(op) {
    op.id = uid();
    op.ts = Date.now();
    noteBlock(op);
    var q = queue();
    q.push(op);
    setQueue(q);
  }

  /**
   * A write that gets set aside has to say which block it belonged to, and most
   * ops cannot: setMark, setText and closeSit name a ref and nothing else. A ref
   * is meaningless to someone holding a phone in front of Google Calendar trying
   * to fix the damage by hand.
   *
   * So every op that does know its category or its start leaves that behind
   * here, keyed by ref, for quarantine() to look up later. It lives in
   * localStorage and not in memory because a write is set aside five failures
   * after it was made, which can easily be a later session than the one that
   * made it. Nothing here goes to the server: the op on the wire is unchanged.
   */
  function blockIdx() {
    var m = ls(K_BLOCKS, {});
    return (m && typeof m === 'object' && !Array.isArray(m)) ? m : {};
  }

  function noteBlock(op) {
    if (!op) return;
    var idx = blockIdx();
    if (op.ref) {
      var e = idx[op.ref] || {};
      if (op.key) e.key = op.key;
      // Only a start is a start. closeActual carries endMs, which is the one
      // time that must never be recorded as when the block began.
      if ((op.type === 'openActual' || op.type === 'openSit' ||
           op.type === 'setSitStart') && isFinite(op.startMs)) e.startMs = op.startMs;
      if (e.startMs === undefined && isFinite(op.hintMs)) e.startMs = op.hintMs;
      idx[op.ref] = e;
    }
    if (op.newRef) {
      var n = idx[op.newRef] || {};
      if (op.newKey) n.key = op.newKey;
      if (isFinite(op.atMs)) n.startMs = op.atMs;   // the split is the new block's start
      idx[op.newRef] = n;
    }
    saveBlocks(idx);
  }

  /** One entry per block, so this grows forever unless it is bounded. */
  function saveBlocks(idx) {
    var keys = Object.keys(idx);
    if (keys.length > 200) {
      keys.sort(function (a, b) { return (idx[a].startMs || 0) - (idx[b].startMs || 0); });
      keys.slice(0, keys.length - 200).forEach(function (k) { delete idx[k]; });
    }
    lsSet(K_BLOCKS, idx);
  }

  /** What a set-aside op can say about the block it belonged to. */
  function blockInfo(op) {
    var e = (op && op.ref && blockIdx()[op.ref]) || {};
    var startMs = null;
    if ((op.type === 'openActual' || op.type === 'openSit') && isFinite(op.startMs)) startMs = op.startMs;
    if (startMs === null && isFinite(op.hintMs)) startMs = op.hintMs;
    if (startMs === null && isFinite(e.startMs)) startMs = e.startMs;
    return { key: op.key || e.key || null, startMs: startMs };
  }

  /** Coalesce a still-pending open into a correction. Returns true if absorbed. */
  function mutatePendingOpen(ref, key) {
    var q = queue(), hit = false;
    for (var i = 0; i < q.length; i++) {
      if (q[i].type === 'openActual' && q[i].ref === ref) { q[i].key = key; hit = true; }
      if (q[i].type === 'splitActual' && q[i].newRef === ref) { q[i].newKey = key; hit = true; }
    }
    // A corrected tap changes which category the block is, so the record of
    // what it belonged to has to move with it.
    if (hit) q.forEach(noteBlock);
    if (hit) setQueue(q);
    return hit;
  }

  /** Typed into the lit box. Debounced, and it rides the close op regardless. */
  function noteChanged(val) {
    if (!S.open) return;
    S.open.text = val;
    saveState();
    if (noteTimer) clearTimeout(noteTimer);
    var ref = S.open.ref, hint = S.open.startMs;
    noteTimer = setTimeout(function () {
      noteTimer = null;
      enqueueText(ref, val, hint);   // belongs to the block that was open when typed
      flush();
    }, 900);
  }

  /** Only the newest note per block needs to survive. */
  function enqueueText(ref, text, hintMs) {
    setQueue(queue().filter(function (o) { return !(o.type === 'setText' && o.ref === ref); }));
    enqueue({ type: 'setText', ref: ref, text: text, hintMs: hintMs });
  }

  function setSync(cls) { $('sync').className = 's-' + cls; paintSync(); }
  /** A grey dot in a corner is invisible. The unsent count is not. */
  function paintSync() {
    var n = queue().length;
    $('syncN').textContent = n ? String(n) : '';
  }

  function flush() {
    if (flushing || !hasRun) return;
    var q = queue();
    if (!q.length) { setSync('synced'); return; }
    flushing = true;
    setSync('pending');
    google.script.run
      .withSuccessHandler(function (res) {
        flushing = false;
        var done = {};
        (res.applied || []).forEach(function (id) { done[id] = 1; });
        setQueue(queue().filter(function (o) { return !done[o.id]; }));
        if (res.dropped && res.dropped.length) {
          showErr('discarded ' + res.dropped.length + ' malformed write' +
                  (res.dropped.length > 1 ? 's' : ''));
        }
        if (res.errors && res.errors.length) {
          quarantine(res.errors[0]);
          setSync('failed');
          scheduleRetry();
        } else {
          hideErr();
          retryDelay = 4000;
          if (queue().length) flush(); else setSync('synced');
        }
      })
      .withFailureHandler(function () {
        flushing = false;
        setSync('failed');
        scheduleRetry();
      })
      .applyOps(q.slice(0, 40));
  }

  /**
   * A server-side failure is counted against the op that caused it. Past
   * MAX_OP_TRIES the op is set aside, because it sits at the head of the queue
   * and every write behind it is waiting on something that is not going to
   * work. Network failures are not counted: those are the case retrying is for.
   */
  function quarantine(err) {
    var q = queue(), i = -1;
    for (var n = 0; n < q.length; n++) if (q[n].id === err.id) { i = n; break; }
    if (i < 0) { showErr(err.message); return; }

    q[i].tries = (q[i].tries || 0) + 1;
    if (q[i].tries < CFG.maxOpTries) {
      setQueue(q);
      showErr(err.message + ' (attempt ' + q[i].tries + ' of ' + CFG.maxOpTries + ')');
      return;
    }
    var dead = ls(K_DEAD, []);
    if (!Array.isArray(dead)) dead = [];
    var info = blockInfo(q[i]);
    dead.push({ at: Date.now(), why: err.message, op: q[i],
                key: info.key, startMs: info.startMs });
    lsSet(K_DEAD, dead.slice(-50));
    q.splice(i, 1);
    setQueue(q);
    showErr('gave up on one write and set it aside: ' + err.message);
  }

  function deadCount() {
    var d = ls(K_DEAD, []);
    return Array.isArray(d) ? d.length : 0;
  }

  /**
   * What each op was trying to do, in the words someone would use to describe
   * it to themselves. The row says what happened and stops there: a set-aside
   * write is a fact, and what to do about it is the reader's call.
   */
  var OP_WORDS = {
    openActual:   'start a block',
    closeActual:  'close a block',
    recategorize: 'change the category',
    setMark:      'save the mark',
    setText:      'save the note',
    splitActual:  'split a block',
    openSit:      'start sitting',
    closeSit:     'stop sitting',
    setSitStart:  'correct when sitting started',
    deleteSit:    'remove a sitting block'
  };

  /**
   * The dead list as rows a person can read, newest first. Entries written by
   * an older version have none of the block fields, and an entry that cannot
   * say something says so rather than rendering blank — a row with an empty
   * cell reads like there was nothing there, which is a different claim.
   */
  function deadRows() {
    var d = ls(K_DEAD, []);
    if (!Array.isArray(d)) return [];
    var rows = [];
    for (var i = 0; i < d.length; i++) {
      var e = d[i] || {}, op = e.op || {};
      rows.push({
        i: i,
        when:    isFinite(e.at) ? clock(e.at) : 'unknown time',
        key:     e.key || op.key || 'unknown category',
        started: isFinite(e.startMs) ? clock(e.startMs) : 'unknown start',
        what:    OP_WORDS[op.type] || (op.type ? String(op.type) : 'unknown write'),
        why:     e.why || 'no reason recorded'
      });
    }
    return rows.reverse();
  }

  function scheduleRetry() {
    if (retryTimer) return;
    retryTimer = setTimeout(function () {
      retryTimer = null;
      retryDelay = Math.min(retryDelay * 2, 60000);
      flush();
    }, retryDelay);
  }

  function showErr(msg) {
    var e = $('err'); e.textContent = msg; e.classList.remove('hidden');
    paintErr();
  }

  /**
   * Clearing a transient error must not clear a standing fact. A write that was
   * set aside stays set aside until someone deals with it by hand, so the banner
   * falls back to saying so instead of going quiet. Before this, a successful
   * state load erased the boot-time notice on its way in, which left it visible
   * only when the load had ALSO failed — visible exactly when it was no use.
   */
  function hideErr() {
    if (deadCount()) { showErr(deadMsg()); return; }
    $('err').classList.add('hidden');
    paintErr();
  }

  function deadMsg() {
    var n = deadCount();
    return n + (n === 1 ? ' write was' : ' writes were') + ' set aside after repeated failures';
  }

  /** The banner is a door only when there is something behind it. */
  function paintErr() {
    var e = $('err');
    if (deadCount()) {
      e.classList.add('tappable');
      e.setAttribute('role', 'button');
      e.setAttribute('tabindex', '0');
      e.setAttribute('aria-label', 'show the writes that were set aside');
    } else {
      e.classList.remove('tappable');
      e.removeAttribute('role');
      e.removeAttribute('tabindex');
      e.removeAttribute('aria-label');
    }
  }

  function openDead() {
    if (!deadCount()) return;
    renderDead();
    $('sheetDead').classList.remove('hidden');
  }

  function closeDead() { $('sheetDead').classList.add('hidden'); }

  /** One row per set-aside write, newest first. */
  function renderDead() {
    var host = $('deadList');
    host.innerHTML = '';
    deadRows().forEach(function (r) {
      var row = document.createElement('div');
      row.className = 'deadrow';

      var when = document.createElement('div');
      when.className = 'dwhen';
      when.textContent = r.when + ' · ' + r.key;

      var what = document.createElement('div');
      what.className = 'dwhat';
      what.textContent = 'tried to ' + r.what + ', block started ' + r.started;

      var why = document.createElement('div');
      why.className = 'dwhy';
      why.textContent = r.why;

      row.appendChild(when); row.appendChild(what); row.appendChild(why);
      host.appendChild(row);
    });
  }

  /* ── logging ───────────────────────────────────────────────── */

  function markFor(key, durMs) {
    var c = catByKey[key];
    if (c && c.autoMark) return { mark: c.autoMark, strip: false };
    if (durMs >= CFG.minMarkMinutes * MS_MIN) return { mark: '=', strip: true };
    return { mark: null, strip: false };
  }

  /** Light the button and wait. Nothing is queued until the second tap. */
  function arm(key) {
    disarm();
    // Repaint when it forgets, or the button keeps offering a confirmation it
    // is no longer holding.
    armed = { key: key, timer: setTimeout(function () { disarm(); render(); },
                                          CFG.confirmTimeoutMs) };
    render();
  }

  function disarm() {
    if (armed && armed.timer) clearTimeout(armed.timer);
    armed = null;
  }

  function tapCategory(key) {
    var now = Date.now();
    if (S.open && S.open.key === key) {
      // The lit button is the open block, so re-tapping it means "correct
      // this", exactly as re-tapping the lit SITTING half means "correct when
      // that started". Below the mis-tap window nothing about the block is
      // settled yet and there is nothing worth cutting, so it stays a no-op.
      // Re-tapping the lit button opens SPLIT, which writes nothing, so it
      // needs no confirming.
      if (now - S.open.startMs >= CFG.mistapSeconds * 1000) openSplit();
      return;                                                        // 6.1
    }

    // Ask before acting on a tap that lands on the heels of the last one.
    if (S.lastTapMs && (now - S.lastTapMs) < CFG.confirmWithinSeconds * 1000 &&
        !(armed && armed.key === key)) {
      arm(key);
      return;
    }
    disarm();

    var mistap = S.open && S.lastTapMs && (now - S.lastTapMs) < CFG.mistapSeconds * 1000;

    if (mistap) {                                                    // 6.3 correction
      S.open.key = key;
      S.lastTapMs = now;
      if (!mutatePendingOpen(S.open.ref, key)) {
        enqueue({ type: 'recategorize', ref: S.open.ref, key: key, hintMs: S.open.startMs });
      }
      if (key === CFG.bodyKey) closeSit(now);
      saveState(); render(); flush();
      return;
    }

    var pending = null;
    if (S.open) {
      var dur = now - S.open.startMs;
      var m = markFor(S.open.key, dur);
      enqueue({ type: 'closeActual', ref: S.open.ref, key: S.open.key, endMs: now,
                mark: m.mark, text: S.open.text || '' });
      if (m.strip) pending = { ref: S.open.ref, key: S.open.key, durMs: dur, hintMs: S.open.startMs };
    }

    var ref = uid();
    S.open = { ref: ref, key: key, text: '', startMs: now };
    S.lastTapMs = now;
    enqueue({ type: 'openActual', ref: ref, key: key, startMs: now });

    if (key === CFG.bodyKey) closeSit(now);                          // 8.2 the only coupling

    if (pending) showStrip(pending); else hideStrip();
    saveState(); render(); flush();
  }

  /* ── the mark ──────────────────────────────────────────────── */

  function showStrip(p) {
    hideStrip();
    strip = p;
    $('stripHead').textContent = p.key + ' closed · ' + fmtEl(p.durMs);
    $('strip').classList.remove('hidden');
    $('posture').classList.add('hidden');
    strip.timer = setTimeout(hideStrip, CFG.markTimeoutMs);          // "=" already written
  }

  function hideStrip() {
    if (strip && strip.timer) clearTimeout(strip.timer);
    strip = null;
    $('strip').classList.add('hidden');
    $('posture').classList.remove('hidden');
  }

  function applyMark(mark) {
    if (!strip) return;
    if (mark !== '=') enqueue({ type: 'setMark', ref: strip.ref, mark: mark, hintMs: strip.hintMs });
    hideStrip();
    flush();
  }

  /* ── sitting ───────────────────────────────────────────────── */

  function closeSit(atMs) {
    if (!S.sit) return;
    enqueue({ type: 'closeSit', ref: S.sit.ref, endMs: atMs });
    S.sit = null;
  }

  /**
   * One button, two states, and which one is a fact about the record rather
   * than a thing to remember: sitting means a SIT block is open, not sitting
   * means none is. Nothing is stored for it, so a reload gets it from the
   * calendar like everything else.
   */
  function toggleSit() {
    var now = Date.now();
    if (S.sit) {
      closeSit(now);
    } else {
      var ref = uid();
      S.sit = { ref: ref, startMs: now };
      enqueue({ type: 'openSit', ref: ref, startMs: now });
    }
    saveState(); render(); flush();
  }

  /* ── render ────────────────────────────────────────────────── */

  /* Two columns for as long as the labels stay readable in them. Three makes a
     cell 137px wide, which turns "Fragments" into "Fragm ents". */
  function colsFor(n) { return n <= 3 ? 1 : (n <= 10 ? 2 : 3); }

  /**
   * Lay the grid out as slots rather than as a list, because three things want
   * different parts of it: the categories belong in the bottom rows where the
   * thumb is, and the two things that are not categories — the add box and any
   * leftover cell — belong in the top row, furthest from it. Putting the add
   * box last gave the rarest action on the screen the best corner on it.
   *
   * Returns one entry per slot: a category, null for the add box, or undefined
   * for an empty one.
   */
  function layoutCells(cats, cols, showAdd) {
    var total = cats.length + (showAdd ? 1 : 0);
    var slots = Math.max(cols, Math.ceil(total / cols) * cols);
    var out = [];
    for (var i = 0; i < slots; i++) out.push(undefined);
    if (showAdd) out[0] = null;

    var free = [];
    for (var r = (slots / cols) - 1; r >= 0; r--) {
      for (var c = 0; c < cols; c++) {
        var ix = r * cols + c;
        if (out[ix] === undefined) free.push(ix);
      }
    }
    cats.forEach(function (cat, n) { if (n < free.length) out[free[n]] = cat; });
    // Anything still undefined stays an empty cell. Every box is the same size
    // and every row holds the same number of them; a box that spanned a row to
    // close a gap would be buying a tidier grid with an inconsistent one.
    return out;
  }

  /** What you aim at. The key is the record's vocabulary, not the button's. */
  function faceOf(c) { return c.label || c.key; }

  function buildGrid() {
    var cols = colsFor(CATS.length + (CATS.length < CFG.maxCategories ? 1 : 0));
    // A third column is 137px wide on a phone, which is the width that turns
    // "Fragments" into "Fragm ents". The label has to know how much room it got.
    var faceSize = cols >= 3 ? 19 : 26;
    var facePad = cols >= 3 ? '7px 9px' : '9px 15px';
    CELL = {};

    var g = $('grid');
    g.innerHTML = '';
    g.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
    layoutCells(CATS, cols, CATS.length < CFG.maxCategories).forEach(function (c) {
      if (c === undefined) {
        var sp = document.createElement('div');
        sp.className = 'gspacer';
        g.appendChild(sp);
        return;
      }
      if (c === null) { g.appendChild(buildAddCell()); return; }
      // A div, not a button: <button> may not contain interactive content, so
      // the parser silently drops an <input> placed inside one.
      var b = document.createElement('div');
      b.className = 'gbtn';
      // A div gets none of a button's semantics for free, so it has to be told:
      // reachable, announced, and answering to a keyboard.
      b.setAttribute('role', 'button');
      b.setAttribute('tabindex', '0');
      b.setAttribute('aria-pressed', 'false');
      b.setAttribute('aria-label', faceOf(c));
      b.dataset.key = c.key;
      b.innerHTML = '<span class="k"></span>' +
        '<input class="gn" type="text" placeholder="add a note" autocomplete="off" ' +
        'autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="done">' +
        '<span class="ge"></span><span class="cf"></span>';
      var face = b.querySelector('.k');
      face.textContent = faceOf(c);
      face.style.fontSize = faceSize + 'px';
      face.style.padding = facePad;
      b.style.background = c.hex;

      var gn = b.querySelector('.gn');
      // The note must not also be a tap on the category it sits inside.
      gn.addEventListener('click', function (e) { if (e && e.stopPropagation) e.stopPropagation(); });
      gn.addEventListener('input', function () {
        if (S.open && S.open.key === c.key) noteChanged(gn.value);
      });
      gn.addEventListener('keydown', function (e) { if (e && e.key === 'Enter') gn.blur(); });

      CELL[c.key] = { box: b, note: gn, el: b.querySelector('.ge') };
      b.addEventListener('click', function () { confirmTap(b); tapCategory(c.key); });
      b.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); b.click(); }
      });
      g.appendChild(b);
    });

    // The split sheet is a picker, not a thumb surface: keep reading order.
    var sg = $('splitGrid');
    sg.innerHTML = '';
    sg.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';
    CATS.forEach(function (c) {
      var b = document.createElement('button');
      b.className = 'sbtn';
      b.innerHTML = '<span class="f"></span>';
      b.querySelector('.f').textContent = faceOf(c);
      b.style.background = c.hex;
      b.addEventListener('click', function () { doSplit(c.key); });
      sg.appendChild(b);
    });
  }

  /**
   * The add box. Tapping it turns its label into the field that names the new
   * category; naming it is the only chance to, since nothing here can be
   * renamed afterwards.
   */
  function buildAddCell() {
    var b = document.createElement('div');
    b.className = 'gbtn addcell';
    b.setAttribute('role', 'button');
    b.setAttribute('tabindex', '0');
    b.setAttribute('aria-label', 'add a category');
    b.dataset.add = '1';
    b.innerHTML = '<span class="k">+</span>' +
      '<input class="an" type="text" placeholder="name it" autocomplete="off" ' +
      'autocapitalize="words" autocorrect="off" spellcheck="false" enterkeyhint="done">';
    var an = b.querySelector('.an');

    function commit() {
      var name = (an.value || '').trim();
      if (!name) { b.classList.remove('naming'); return; }
      if (!hasRun) { showErr('cannot add a category while offline'); return; }
      b.classList.add('busy');
      google.script.run
        .withSuccessHandler(function (cfg) {
          hideErr();
          CFG.categories = cfg.categories;
          CATS = CFG.categories;
          catByKey = {};
          CATS.forEach(function (c) { catByKey[c.key] = c; });
          buildGrid();
          render();
        })
        .withFailureHandler(function (e) {
          b.classList.remove('busy');
          showErr(String((e && e.message) || e));
        })
        .addCategory(name);
    }

    an.addEventListener('click', function (e) { if (e && e.stopPropagation) e.stopPropagation(); });
    an.addEventListener('keydown', function (e) { if (e && e.key === 'Enter') an.blur(); });
    an.addEventListener('blur', commit);
    b.addEventListener('click', function () {
      if (b.classList.contains('busy')) return;
      b.classList.add('naming');
      an.focus();
    });
    b.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); b.click(); }
    });
    return b;
  }

  /** One beat, 140ms, on the button that was actually hit. */
  function confirmTap(b) {
    b.classList.add('tapped');
    setTimeout(function () { b.classList.remove('tapped'); }, 140);
  }

  function render() {
    var now = Date.now();

    $('postureBtn').classList.toggle('on', !!S.sit);
    $('postureBtn').setAttribute('aria-pressed', S.sit ? 'true' : 'false');
    $('postureLabel').textContent = S.sit ? 'SITTING' : 'NOT SITTING';
    // Only sitting has a duration, because only sitting is written down.
    $('sitEdit').classList.toggle('off', !S.sit);
    $('sitEl').textContent = S.sit ? fmtEl(now - S.sit.startMs) : '';

    $('grid').classList.toggle('idle', !S.open);

    var kids = $('grid').children;
    for (var i = 0; i < kids.length; i++) {
      var k = kids[i].dataset.key, cell = CELL[k];
      if (!k) continue;                                   // the add box
      var isOpen = !!S.open && k === S.open.key;
      kids[i].classList.toggle('active', isOpen);
      kids[i].setAttribute('aria-pressed', isOpen ? 'true' : 'false');
      kids[i].classList.toggle('long',
        isOpen && (now - S.open.startMs) > CFG.longBlockMinutes * MS_MIN);

      var isArmed = !!armed && armed.key === k;
      kids[i].classList.toggle('arming', isArmed);
      if (cell) {
        cell.el.textContent = isOpen ? fmtEl(now - S.open.startMs) : '';
        // Never overwrite what is being typed right now.
        if (cell.note !== document.activeElement) cell.note.value = isOpen ? (S.open.text || '') : '';
        var cf = kids[i].querySelector('.cf');
        if (cf) cf.textContent = isArmed ? 'TAP AGAIN' : '';
      }
    }
    paintSync();
  }

  function tick() {
    var now = Date.now();
    if (S.open && CELL[S.open.key]) {
      CELL[S.open.key].el.textContent = fmtEl(now - S.open.startMs);
      CELL[S.open.key].box.classList.toggle('long',
        (now - S.open.startMs) > CFG.longBlockMinutes * MS_MIN);
    }
    if (S.sit) $('sitEl').textContent = fmtEl(now - S.sit.startMs);
  }

  /* ── split ─────────────────────────────────────────────────── */

  function openSplit() {
    if (!S.open) return;
    split.startMs = S.open.startMs;
    split.nowMs = Date.now();
    var span = Math.max(1, Math.round((split.nowMs - split.startMs) / MS_MIN));
    var r = $('spRange');
    r.min = 1; r.max = Math.max(1, span - 1); r.step = 1;
    r.value = Math.max(1, Math.round(span / 2));
    $('spLab').textContent = 'OPEN BLOCK: ' + S.open.key;
    $('spStart').textContent = clock(split.startMs);
    $('spNow').textContent = clock(split.nowMs);
    renderSplit();
    $('sheetSplit').classList.remove('hidden');
  }

  function renderSplit() {
    var mins = parseInt($('spRange').value, 10) || 1;
    split.atMs = split.startMs + mins * MS_MIN;
    $('spAt').textContent = clock(split.atMs);
    $('spSub').textContent = (S.open ? S.open.key : '?') + ' ' + fmtDur(split.atMs - split.startMs) +
      '   →   ' + fmtDur(split.nowMs - split.atMs) + ' remainder';
  }

  function doSplit(key) {
    if (!S.open) { $('sheetSplit').classList.add('hidden'); return; }
    var at = split.atMs, now = Date.now();
    var m = markFor(S.open.key, at - S.open.startMs);
    var newRef = uid();
    enqueue({ type: 'splitActual', ref: S.open.ref, atMs: at, mark: m.mark,
              text: S.open.text || '', newRef: newRef, newKey: key, nowMs: now });
    S.open = { ref: newRef, key: key, text: '', startMs: at };
    S.lastTapMs = now;
    if (key === CFG.bodyKey) closeSit(now);
    hideStrip();
    $('sheetSplit').classList.add('hidden');
    saveState(); render(); flush();
  }

  /* ── sit start ─────────────────────────────────────────────── */

  function openSitEdit() {
    if (!S.sit) return;
    var now = Date.now();
    sitEdit.hi = now;
    sitEdit.lo = Math.min(S.sit.startMs, now - 6 * 3600000);
    var span = Math.max(1, Math.round((sitEdit.hi - sitEdit.lo) / MS_MIN));
    var r = $('ssRange');
    r.min = 0; r.max = span; r.step = 1;
    r.value = Math.round((S.sit.startMs - sitEdit.lo) / MS_MIN);
    $('ssLo').textContent = clock(sitEdit.lo);
    $('ssHi').textContent = clock(sitEdit.hi);
    renderSitEdit();
    $('sheetSit').classList.remove('hidden');
  }

  function renderSitEdit() {
    var mins = parseInt($('ssRange').value, 10) || 0;
    sitEdit.atMs = Math.min(sitEdit.lo + mins * MS_MIN, sitEdit.hi - MS_MIN);
    $('ssAt').textContent = clock(sitEdit.atMs);
    $('ssSub').textContent = fmtDur(Date.now() - sitEdit.atMs) + ' sitting';
  }

  /* ── boot ──────────────────────────────────────────────────── */

  function adoptServerState(st) {
    // Anything the user did while the round trip was in flight wins.
    if (!queue().length) {
      S.open = st.open ? { ref: st.open.ref, key: st.open.key, text: st.open.text || '', startMs: st.open.startMs } : null;
      S.sit = st.sit ? { ref: st.sit.ref, startMs: st.sit.startMs } : null;
      S.lastTapMs = 0;
      render();
      saveState();
    }
  }

  function boot() {
    var saved = ls(K_STATE, null);
    if (saved && typeof saved === 'object') {
      S.open = saved.open || null;
      S.sit = saved.sit || null;
      S.lastTapMs = 0;                 // a reload is never a mis-tap window
    }
    buildGrid();
    render();
    if (deadCount()) showErr(deadMsg());

    if (!hasRun) { showErr('google.script.run unavailable'); return; }

    // Drain first so the calendar reflects everything before we read it.
    var q = queue();
    if (q.length) {
      setSync('pending');
      google.script.run
        .withSuccessHandler(function (res) {
          var done = {};
          (res.applied || []).forEach(function (id) { done[id] = 1; });
          setQueue(queue().filter(function (o) { return !done[o.id]; }));
          if (queue().length) { setSync('failed'); scheduleRetry(); }
          else { setSync('synced'); loadServerState(); }
        })
        .withFailureHandler(function () { setSync('failed'); scheduleRetry(); })
        .applyOps(q.slice(0, 40));
    } else {
      loadServerState();
    }
  }

  function loadServerState() {
    google.script.run
      .withSuccessHandler(function (st) {
        lastStateMs = Date.now();
        hideErr();
        adoptServerState(st);
      })
      .withFailureHandler(function (e) { showErr(String((e && e.message) || e)); })
      .getState();
  }

  /**
   * The stale guard lives in getState, so it only ever ran on a page load — and
   * a home screen web app can stay warm for days. Coming back to it counts as
   * arriving: re-read if the state is stale, or if the open block has already
   * outrun the bound the guard would have put on it.
   */
  function refreshOnReturn() {
    if (!hasRun || queue().length) return;
    var now = Date.now();
    var overdue = (now - lastStateMs) > 10 * 60000;
    var runaway = S.open && (now - S.open.startMs) > CFG.staleOpenHours * 3600000;
    if (overdue || runaway) loadServerState();
  }

  /* ── wiring ────────────────────────────────────────────────── */

  $('strip').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-mark]');
    if (b) { applyMark(b.dataset.mark); return; }
    // Anywhere else on the strip dismisses it. It covers the posture row for
    // its six seconds, and without this there was nothing to tap to get the
    // row back. "=" is already written, so dismissing costs nothing.
    hideStrip();
  });

  $('postureBtn').addEventListener('click', toggleSit);
  $('sitEdit').addEventListener('click', openSitEdit);

  $('err').addEventListener('click', function () { openDead(); });
  $('err').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDead(); }
  });
  $('dgClose').addEventListener('click', closeDead);

  $('spClose').addEventListener('click', function () { $('sheetSplit').classList.add('hidden'); });
  $('spRange').addEventListener('input', renderSplit);

  $('ssClose').addEventListener('click', function () { $('sheetSit').classList.add('hidden'); });
  $('ssRange').addEventListener('input', renderSitEdit);
  $('ssApply').addEventListener('click', function () {
    if (S.sit) {
      S.sit.startMs = sitEdit.atMs;
      enqueue({ type: 'setSitStart', ref: S.sit.ref, startMs: sitEdit.atMs });
      saveState(); render(); flush();
    }
    $('sheetSit').classList.add('hidden');
  });
  $('ssDelete').addEventListener('click', function () {
    if (S.sit) {
      enqueue({ type: 'deleteSit', ref: S.sit.ref, hintMs: S.sit.startMs });
      S.sit = null;
      saveState(); render(); flush();
    }
    $('sheetSit').classList.add('hidden');
  });

  window.addEventListener('online', function () { retryDelay = 4000; flush(); });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) return;
    retryDelay = 4000;
    flush();
    render();
    refreshOnReturn();
  });

  setInterval(tick, 1000);
  boot();
})();
</script>
