name: TimeTap
options:
  bundleIdPrefix: app.timetap
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: timetap
    INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.1.0"
targets:
  TimeTap:
    type: application
    platform: iOS
    sources:
      - path: TimeTap
        excludes:
          - Config/Google.xcconfig.example
    configFiles:
      Debug: TimeTap/Config/Google.xcconfig
      Release: TimeTap/Config/Google.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.timetap.ios
        DEVELOPMENT_TEAM: "Y3NGT7263T"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        INFOPLIST_FILE: TimeTap/Info.plist
        ENABLE_TESTABILITY: YES
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
  TimeTapTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TimeTapTests
    dependencies:
      - target: TimeTap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.timetap.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: "Y3NGT7263T"
        CODE_SIGN_STYLE: Automatic
schemes:
  TimeTap:
    build:
      targets:
        TimeTap: all
        TimeTapTests: [test]
    test:
      targets:
        - TimeTapTests
