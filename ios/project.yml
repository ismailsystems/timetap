name: TimeTap
options:
  bundleIdPrefix: app.timetap
  deploymentTarget:
    iOS: "17.2"
    watchOS: "10.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: timetap
    INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.1.0"
targets:
  TimeTap:
    type: application
    platform: iOS
    sources:
      - path: TimeTap
        excludes:
          - Config/Google.xcconfig.example
    configFiles:
      Debug: TimeTap/Config/Google.xcconfig
      Release: TimeTap/Config/Google.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.timetap.ios
        DEVELOPMENT_TEAM: "Y3NGT7263T"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        INFOPLIST_FILE: TimeTap/Info.plist
        ENABLE_TESTABILITY: YES
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - target: TimeTapWidget
        embed: true
        codeSign: true
      - target: TimeTapWatch
        embed: true
        codeSign: true
  TimeTapWatch:
    type: application
    platform: watchOS
    sources:
      - path: TimeTapWatch
      - path: TimeTap/Watch/WatchPayload.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.timetap.ios.watchkitapp
        DEVELOPMENT_TEAM: "Y3NGT7263T"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: TimeTapWatch/Info.plist
        TARGETED_DEVICE_FAMILY: "4"
        WKCompanionAppBundleIdentifier: app.timetap.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: timetap
    dependencies:
      - target: TimeTapWatchWidgets
        embed: true
        codeSign: true
  TimeTapWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: TimeTapWatchWidgets
      - path: TimeTap/Watch/WatchPayload.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.timetap.ios.watchkitapp.widgets
        DEVELOPMENT_TEAM: "Y3NGT7263T"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: TimeTapWatchWidgets/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: timetap
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "4"
  TimeTapWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: TimeTapWidget
      - path: TimeTap/LiveActivity/RunningBlockAttributes.swift
      - path: TimeTap/LiveActivity/RunningBlockIntents.swift
      - path: TimeTap/LiveActivity/ElapsedTimer.swift
      - path: TimeTap/LiveActivity/IslandCompact.swift
      - path: TimeTap/Theme.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.timetap.ios.widget
        DEVELOPMENT_TEAM: "Y3NGT7263T"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: TimeTapWidget/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: timetap
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
        TARGETED_DEVICE_FAMILY: "1"
  TimeTapMac:
    type: application
    platform: macOS
    sources:
      - path: TimeTapMac
      - path: TimeTap
        excludes:
          - Config/Google.xcconfig.example
          - TimeTapApp.swift
          - LiveActivity
          - Watch/WatchBridge.swift
    configFiles:
      Debug: TimeTap/Config/Google.xcconfig
      Release: TimeTap/Config/Google.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.timetap.mac
        DEVELOPMENT_TEAM: "Y3NGT7263T"
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: TimeTapMac/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: timetap
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
        ENABLE_TESTABILITY: YES
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
  TimeTapMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TimeTapMacTests
        optional: true
    dependencies:
      - target: TimeTapMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.timetap.mac.tests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: "Y3NGT7263T"
        CODE_SIGN_STYLE: Automatic
  TimeTapTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TimeTapTests
    dependencies:
      - target: TimeTap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.timetap.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: "Y3NGT7263T"
        CODE_SIGN_STYLE: Automatic
  TimeTapUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TimeTapUITests
    dependencies:
      - target: TimeTap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.timetap.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: "Y3NGT7263T"
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: TimeTap
schemes:
  TimeTap:
    build:
      targets:
        TimeTap: all
        TimeTapWidget: all
        TimeTapWatch: all
        TimeTapWatchWidgets: all
        TimeTapTests: [test]
        TimeTapUITests: [test]
    test:
      targets:
        - TimeTapTests
        - TimeTapUITests
  TimeTapMac:
    build:
      targets:
        TimeTapMac: all
        TimeTapMacTests: [test]
    test:
      targets:
        - TimeTapMacTests
